# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → pick this repository and branch. Render asks for ADMIN_EMAIL and ADMIN_PASSWORD.
#
# The free plans are for trying the app out (the web service sleeps when idle and the free database expires
# after 30 days). For a real event with thousands of students, switch both plans to paid ones — see README.
services:
  - type: web
    name: quiz-competition
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quiz-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: HTTPS
        value: 'true'
      - key: TRUST_PROXY
        value: '1'
      - key: WEB_CONCURRENCY
        value: '1'
      # Loads the demo competition, 30 sample questions and 3 demo students (password Student@123).
      # Set to false (and delete the demo competition) before your real event.
      - key: SEED_DEMO
        value: 'true'

databases:
  - name: quiz-db
    plan: free
    databaseName: quiz_competition
    user: quiz
